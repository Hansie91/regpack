rationales:
  - {id: RAT-0001, text: A novation or assignment is not a new trade in this synthetic demo}
  - {id: RAT-0002, text: A natural person needs a policy decision so the demo says undetermined}
  - {id: RAT-0003, text: A legal entity client without an identifier cannot be reported so the demo says undetermined}
  - {id: RAT-0004, text: An amendment or a correction is not built in this demo so it says undetermined}
  - {id: RAT-0005, text: Only two capacities are built in this demo so any other or an absent capacity says undetermined}
  - {id: RAT-0006, text: An equity traded on a venue is reported as a new report in this synthetic demo}
  - {id: RAT-0007, text: The cancel of an equity traded on a venue is reported as a cancel in this synthetic demo}
  - {id: RAT-0008, text: No rule matched so the catch-all gives undetermined}
