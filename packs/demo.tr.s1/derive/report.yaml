# The derive table of the demo pack: a row gives one field of the report; a row whose when is false
# gives no field. Values are expressions; the engine renders them as text (decimal plain, instant
# with six digits, enumeration by name). A cancel carries the executing and the submitting entity
# only; the report builder adds the report number. Synthetic: no regulatory text.
table: {id: demo.tr.s1.report}
rows:
  - {id: D-EXEC, field: executing_lei, value: "firm.lei", rule_ref: DR-0001, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-SUBMIT, field: submitting_lei, value: "firm.lei", rule_ref: DR-0002, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-BUYER, field: buyer, when: "event.kind == 'NEW'", value: "trade.side == 'BUY' ? (trade.capacity == 'AOTC' ? client.lei : firm.lei) : trade.counterparty", rule_ref: DR-0003, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-SELLER, field: seller, when: "event.kind == 'NEW'", value: "trade.side == 'SELL' ? (trade.capacity == 'AOTC' ? client.lei : firm.lei) : trade.counterparty", rule_ref: DR-0004, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-TIME, field: trading_datetime, when: "event.kind == 'NEW'", value: "isoMicros(event.tradedAt)", rule_ref: DR-0005, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-CAPACITY, field: capacity, when: "event.kind == 'NEW'", value: "trade.capacity", rule_ref: DR-0006, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-QTY, field: quantity, when: "event.kind == 'NEW'", value: "string(round(trade.quantity, 4, 'HALF_EVEN'))", rule_ref: DR-0007, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-PRICE, field: price, when: "event.kind == 'NEW'", value: "string(round(trade.price, 6, 'HALF_EVEN'))", rule_ref: DR-0008, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-CURRENCY, field: price_currency, when: "event.kind == 'NEW'", value: "trade.currency", rule_ref: DR-0009, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-VENUE, field: venue, when: "event.kind == 'NEW'", value: "venue.mic", rule_ref: DR-0010, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-INSTRUMENT, field: instrument, when: "event.kind == 'NEW'", value: "instrument.isin", rule_ref: DR-0011, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-WITHIN, field: execution_within_firm, when: "event.kind == 'NEW' && has(trade.executionWithin)", value: "trade.executionWithin", rule_ref: DR-0012, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
  - {id: D-TRANSMIT, field: transmission, when: "event.kind == 'NEW'", value: "'false'", rule_ref: DR-0013, cite: [{source_id: fixture-law, provision_path: fixture/1, role: BASIS}]}
